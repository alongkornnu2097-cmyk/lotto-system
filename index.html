<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงตัวเลขหวย - Professional Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .font-mono { font-family: 'JetBrains+Mono', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        #pdf-render-zone { position: absolute; left: -9999px; top: -9999px; width: 750px; background: #ffffff; }
        .pdf-page-container { padding: 30px 40px; background: #ffffff; color: #000000; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .pdf-table th { background: #f8fafc; padding: 6px 8px; text-align: left; border-bottom: 1px solid #cbd5e1; font-size: 13px; font-weight: bold; color: #1e293b; }
        .pdf-table td { padding: 4px 8px; border-bottom: 1px solid #f1f5f9; font-size: 12px; line-height: 1.2; }
        .pdf-total-row { background: #f5f3ff !important; font-weight: bold; border-top: 1.5px solid #4338ca; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useMemo, useEffect } = React;
        let app, auth, db, appId;
        let isExternalHosting = false;

        // Configuration
        const customFirebaseConfig = {
            apiKey: "AIzaSyA_GjcYxRoya1GkMvMiXgDy_HlQf3PvQnE",
            authDomain: "mynumberlotto.firebaseapp.com",
            projectId: "mynumberlotto",
            storageBucket: "mynumberlotto.firebasestorage.app",
            messagingSenderId: "1024778141895",
            appId: "1:1024778141895:web:b7d79174eac9efce29bee2",
            measurementId: "G-LDRZ538BMQ"
        };

        if (typeof __firebase_config !== 'undefined') {
            const firebaseConfig = JSON.parse(__firebase_config);
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } else {
            isExternalHosting = true;
            app = initializeApp(customFirebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = "custom-external-app";
        }

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [periods, setPeriods] = useState(['16-07-2026']);
            const [activePeriod, setActivePeriod] = useState('16-07-2026');
            const [entries, setEntries] = useState([]);
            const [historyEntries, setHistoryEntries] = useState([]);
            const [receivers, setReceivers] = useState([{ id: 'r1', name: 'พี่อ้อม', blockedNumbers: [] }, { id: 'r2', name: 'น้าไก่', blockedNumbers: [] }]);
            
            // UI States
            const [activeReceiverId, setActiveReceiverId] = useState('r1');
            const [number, setNumber] = useState('');
            const [price, setPrice] = useState('');
            const [type, setType] = useState('3-direct');
            const [notification, setNotification] = useState(null);
            const [activeTab, setActiveTab] = useState('entry');
            const [isSaving, setIsSaving] = useState(false);
            const [showPreview, setShowPreview] = useState(false);
            const [sheetUrl] = useState('https://script.google.com/macros/s/AKfycbxmTp_gZ7iJf8ixFNRVxnNr8yoPI2f6flxZ71hUZdwSbfcZb8KUvpViB8GvySHxIKRN/exec');

            // Auth Effect
            useEffect(() => {
                onAuthStateChanged(auth, async (currentUser) => {
                    if (currentUser) setUser(currentUser);
                    else await signInAnonymously(auth);
                });
            }, []);

            // Data Fetching Effects (Firestore)
            useEffect(() => {
                if (!db || !user) return;
                const unsubEntries = onSnapshot(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', `entries_${activePeriod}`), (s) => s.exists() ? setEntries(s.data().list) : setEntries([]));
                const unsubHist = onSnapshot(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', `history_${activePeriod}`), (s) => s.exists() ? setHistoryEntries(s.data().list) : setHistoryEntries([]));
                return () => { unsubEntries(); unsubHist(); };
            }, [user, activePeriod]);

            // Handlers
            const updateEntriesInDB = async (newList) => {
                setEntries(newList);
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', `entries_${activePeriod}`), { list: newList });
            };

            const updateHistoryInDB = async (newList) => {
                setHistoryEntries(newList);
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', `history_${activePeriod}`), { list: newList });
            };

            const saveToGoogleSheets = async () => {
                if (entries.length === 0) return;
                setIsSaving(true);
                try {
                    await fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ entries, period: activePeriod }) });
                    await updateHistoryInDB([...historyEntries, ...entries]);
                    await updateEntriesInDB([]);
                    setNotification({ msg: 'บันทึกสำเร็จ!', type: 'success' });
                } catch (e) { setNotification({ msg: 'ผิดพลาด', type: 'error' }); }
                finally { setIsSaving(false); }
            };

            const totalPrice = entries.reduce((sum, item) => sum + item.price, 0);
            const dashboardEntries = [...historyEntries, ...entries];
            const dashboardTotalPrice = dashboardEntries.reduce((sum, item) => sum + item.price, 0);

            // Render
            return (
                <div className="min-h-screen bg-slate-50 p-4">
                    <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-sm p-6">
                        <div className="flex gap-4 mb-6 border-b pb-4">
                            <button onClick={() => setActiveTab('entry')} className="font-bold">ลงหวย</button>
                            <button onClick={() => setActiveTab('dashboard')} className="font-bold">สรุปยอด</button>
                        </div>

                        {activeTab === 'entry' && (
                            <div>
                                <input type="number" value={number} onChange={e => setNumber(e.target.value)} placeholder="เลข" className="w-full p-4 border rounded-xl mb-4" />
                                <input type="text" value={price} onChange={e => setPrice(e.target.value)} placeholder="ราคา" className="w-full p-4 border rounded-xl mb-4" />
                                <button onClick={() => updateEntriesInDB([...entries, { id: Date.now(), number, price: parseFloat(price), typeName: type, displayValue: `${number}=${price}`, receiverName: 'ทั่วไป' }])} className="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">เพิ่มรายการ</button>
                                <div className="mt-4">ยอดรวม: ฿{totalPrice.toLocaleString()}</div>
                                <button onClick={saveToGoogleSheets} className="w-full bg-emerald-600 text-white p-4 rounded-xl mt-2">ลงชีต</button>
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div>
                                <h2 className="text-xl font-bold mb-4">สรุปยอดรวม: ฿{dashboardTotalPrice.toLocaleString()}</h2>
                                <div className="max-h-60 overflow-y-auto border rounded-xl p-4">
                                    {dashboardEntries.map(e => <div key={e.id}>{e.displayValue} - ฿{e.price}</div>)}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
